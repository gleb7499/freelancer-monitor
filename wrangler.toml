name = "freelancer-monitor"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Промты — только в файлах prompts/*.md (см. AGENT.md), импортируются как текст.
[[rules]]
type = "Text"
globs = [ "**/*.md" ]
fallthrough = true

[[kv_namespaces]]
binding = "ORDERS_KV"
id = "b629829e784842d3a9c78f612f689974"

[[d1_databases]]
binding = "DB"
database_name = "freelancer-monitor"
database_id = "d57b5e01-e517-4b7e-8e7a-cc3e4dae479a"

[durable_objects]
bindings = [
  { name = "CHANNEL_RUNNER", class_name = "ChannelRunner" },
  { name = "ORDERS_BANK", class_name = "OrdersBank" },
  { name = "BIDS_BUDGET", class_name = "BidBudget" },
]

# Миграции классов Durable Object (append-only, не путать с migrations/ — те для D1).
# v1: TickScheduler (архитектура единого тика) — класс удалён из кода вместе
# с binding; запись в истории миграций остаётся.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TickScheduler"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ChannelRunner", "OrdersBank", "BidBudget"]
deleted_classes = ["TickScheduler"]

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
KIMI_API_BASE = "https://api.kimi.ai/coding/v1"
KIMI_MODEL = "kimi-for-coding"
FREELANCER_API_BASE = "https://www.freelancer.com/api/projects/0.1"
DEFAULT_WEEKLY_LIMIT = "40"
TARGET_HOURLY = "20"
BID_MIN_SCORE = "10"
# ВРЕМЕННО выключено ради первых отзывов: отклик на все BID модели независимо от
# value_score. "true" возвращает отсев по BID_MIN_SCORE.
SCORE_GATE_ENABLED = "false"
# Потолки фазы 0 (первые отзывы): гейты конкуренции и бюджета.
PHASE_MAX_BIDS = "15"
PHASE_BUDGET_FIXED_USD = "50"
PHASE_BUDGET_HOURLY_USD = "15"
# Заказы старше N минут не обрабатываются (после простоя берём только свежие).
MAX_ORDER_AGE_MIN = "20"
