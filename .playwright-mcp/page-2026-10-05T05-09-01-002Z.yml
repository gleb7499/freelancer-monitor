        - paragraph [ref=e89]: "I need a secure, web-based platform that lets me log in and watch Binance, Coinbase and Kraken and more simultaneously. The system must stream live order-book data and weave together volume, open interest, incoming-versus-outgoing flows and liquidity levels into a single proprietary indicator that updates in real time and shows bias based on bullish / bearish sentiment. A clean dashboard with time-series charts, heat maps and quick-filter controls should make it easy to spot shifts in market pressure at a glance. When any metric hits a value I define, I want the option to turn on notifications and choose whether the alert is sent by email or SMS; switching alerts on or off must be possible from inside the app. Core deliverables: • API connectors for Binance, Coinbase, Kraken with sub-second refresh • Aggregation engine that calculates the composite indicator (volume, open interest, liquidity) • Responsive dashboard with user login, charting and flow visualisation • Configurable alert module (email and SMS) • Source code, install guide and brief hand-off call Acceptance criteria will be met when the live feed matches the exchanges’ native data, alerts fire correctly at user-set thresholds, and the interface performs smoothly in a modern browser. Check out a similar website but this project needs to have the additional indicators as above NO CONTACT OUTWITH FREELANCER OR YOU WILL BE REPORTED. ONLY MESSAGE / BID ON FREELANCER."
